name: Build EXE

# Manual, because a release is a decision and not a side effect of pushing. It can also be
# dispatched from a branch, which is how a build is proven before the commit reaches main.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (for example v2.1.0). Defaults to v<package.json version>.'
        required: false
      prerelease:
        description: 'Mark the release as a pre-release'
        type: boolean
        default: false
      publish:
        description: 'Publish the release after all checks pass (leave off for verification)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      # The gates the release depends on. If any of these fails, nothing is packaged or published.
      - run: npm run typecheck

      # Build before test. Some of the contract tests inspect the build output - they check that
      # package.json's `main`, the preload and the renderer HTML are the files the build actually
      # emits - so running the suite first asked them a question about a folder that did not
      # exist yet. They are written to build for themselves when it is missing, but doing it in
      # this order means the suite tests the same artifacts that get shipped.
      - run: npm run build

      - name: Run the tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt

      # The job log is served from a storage host that the machine dispatching these runs cannot
      # always reach, so the failing assertions are also emitted as an annotation, which the
      # check-runs API serves directly.
      - name: Show the failure
        if: failure()
        shell: bash
        run: |
          detail=$(grep -nE "not ok|AssertionError|Expected|actual:|expected:|Error:" test-output.txt | head -40 || true)
          echo "::error title=TEST OUTPUT::$(printf '%s' "$detail" | tr '\n' '|' | cut -c1-6000)"

      - name: Read the version
        id: meta
        shell: bash
        # Passed through the environment rather than interpolated into the script. `${{ }}` is
        # substituted before bash sees the line, so a tag containing a quote or a backtick would
        # become shell syntax, and an unset optional input arrives as the four characters
        # "null" rather than as empty - both silently produce a wrong tag.
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -eu
          # One number, taken from package.json - the same one the app reports at runtime.
          version=$(node -p "require('./package.json').version")
          tag="${INPUT_TAG:-}"
          # The action hands an unset input through as the literal string "null".
          if [ -z "$tag" ] || [ "$tag" = "null" ]; then tag="v$version"; fi
          case "$tag" in
            v*) ;;
            *) echo "::error::tag '$tag' must start with v"; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Building $tag ($version)"

      # --publish never: the release step below owns publishing, so a failed upload cannot leave
      # a half-populated release behind.
      - run: npx electron-builder --win --x64 --publish never

      - name: Check the artifacts exist
        shell: bash
        run: |
          set -eu
          for file in release/JoeBrowserSetup.exe; do
            if [ ! -f "$file" ]; then
              echo "::error::$file was not produced by electron-builder"
              ls -la release || true
              exit 1
            fi
          done
          ls -la release

      - name: Test the installed Windows application
        run: node scripts/windows-smoke.mjs

      - name: Test live browser and store downloads
        shell: bash
        run: |
          set -o pipefail
          npx esbuild scripts/live-windows-smoke.ts --bundle --platform=node --format=cjs --external:playwright-core --outfile=live-windows-smoke.cjs
          node live-windows-smoke.cjs 2>&1 | tee live-smoke-output.txt

      - name: Report live test failure
        if: failure()
        shell: bash
        run: |
          if [ -f live-smoke-output.txt ]; then
            detail=$(tail -30 live-smoke-output.txt | tr '\n' '|' | cut -c1-6000)
            echo "::error title=LIVE TEST OUTPUT::$detail"
          fi

      - name: Upload verification binaries
        if: ${{ inputs.publish != true }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-verification-binaries
          path: |
            release/JoeBrowserSetup.exe
          if-no-files-found: error
          retention-days: 7

      - name: Publish the release
        if: ${{ inputs.publish == true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Joe Browser ${{ steps.meta.outputs.version }}
          prerelease: ${{ inputs.prerelease }}
          # Notes are written from the commits since the previous tag, so the release says what
          # actually changed rather than what a template guessed.
          generate_release_notes: true
          # Created if absent. Without this the action fails on a tag that does not exist yet.
          target_commitish: ${{ github.sha }}
          # A release with no binaries attached is worse than a failed build, because it looks
          # like a finished one.
          fail_on_unmatched_files: true
          files: |
            release/JoeBrowserSetup.exe
